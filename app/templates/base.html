<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Sentinel{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request.htmx-indicator { display: inline; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <nav class="bg-white border-b border-slate-200 px-6 py-0 flex items-center gap-0 h-14">
    <a href="/" class="flex items-center gap-2 mr-8 text-indigo-700 font-bold text-lg tracking-tight">
      🛡️ Sentinel
    </a>

    {% set path = request.url.path %}
    <a href="/questionnaires"
       class="h-14 flex items-center px-4 text-sm border-b-2 transition-colors
              {% if path.startswith('/questionnaires') %}border-indigo-600 text-indigo-700 font-medium{% else %}border-transparent text-slate-600 hover:text-indigo-600{% endif %}">
      Questionnaires
    </a>
    <a href="/knowledge"
       class="h-14 flex items-center px-4 text-sm border-b-2 transition-colors
              {% if path.startswith('/knowledge') %}border-indigo-600 text-indigo-700 font-medium{% else %}border-transparent text-slate-600 hover:text-indigo-600{% endif %}">
      Knowledge Base
    </a>
    <a href="/admin/usage"
       class="h-14 flex items-center px-4 text-sm border-b-2 transition-colors
              {% if path.startswith('/admin') %}border-indigo-600 text-indigo-700 font-medium{% else %}border-transparent text-slate-600 hover:text-indigo-600{% endif %}">
      Usage
    </a>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
