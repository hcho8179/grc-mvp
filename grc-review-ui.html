<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sentinel GRC — AI Review Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{-webkit-font-smoothing:antialiased;box-sizing:border-box}
    body{overflow:hidden;font-family:'Inter',system-ui,sans-serif}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:99px}

    /* Skeleton shimmer */
    @keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
    .skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);
               background-size:1000px 100%;animation:shimmer 1.8s infinite}

    /* Glow pulse on active step */
    @keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(30,58,138,0.3)}
                          50%{box-shadow:0 0 0 8px rgba(30,58,138,0)}}
    .glow-pulse{animation:glowPulse 1.6s ease-in-out infinite}

    /* Card approve flash */
    @keyframes approveFlash{0%{background:#fff}30%{background:#f0fdf4}100%{background:#fff}}
    @keyframes rejectFlash{0%{background:#fff}30%{background:#fef2f2}100%{background:#fff}}
    .approve-flash{animation:approveFlash .4s ease forwards}
    .reject-flash{animation:rejectFlash .4s ease forwards}

    /* Slide out */
    @keyframes slideOut{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(40px)}}
    @keyframes slideIn{0%{opacity:0;transform:translateX(-20px)}100%{opacity:1;transform:translateX(0)}}
    .slide-out{animation:slideOut .28s ease forwards}
    .slide-in{animation:slideIn .28s ease forwards}

    /* Toast */
    @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes toastOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
    .toast{animation:toastIn .25s ease,toastOut 2.8s ease .2s forwards}

    /* Progress bar */
    .pbar{transition:width .5s cubic-bezier(.4,0,.2,1)}

    /* Badge pulse */
    @keyframes badgePop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
    .badge-pop{animation:badgePop .25s ease}

    .kbd{display:inline-flex;align-items:center;justify-content:center;
         background:#f1f5f9;border:1px solid #cbd5e1;border-bottom-width:2px;
         border-radius:4px;font-size:10px;font-weight:700;color:#475569;
         padding:1px 5px;line-height:1.4;font-family:monospace}
  </style>
</head>
<body class="bg-[#F8FAFC]">
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useRef, useCallback} = React;

/* ─── Mock Data ─────────────────────────────────────────────────────────── */

      {doc:"Security Awareness Training Policy.pdf", excerpt:"Annual completion of the Security Awareness Training programme is mandatory for all permanent staff and contractors. A minimum pass rate of 80% is required. Non-completions after 14 days are escalated to the employee's line manager.", score:0.97},

/* ─── Helpers ────────────────────────────────────────────────────────────── */
const NAVY = '#1E3A8A';

function confidenceColor(score) {
  if (score >= 85) return {bg:'#F0FDF4', border:'#86EFAC', text:'#15803D', dot:'#22C55E'};
  if (score >= 70) return {bg:'#FFFBEB', border:'#FCD34D', text:'#B45309', dot:'#F59E0B'};
  return {bg:'#FEF2F2', border:'#FCA5A5', text:'#B91C1C', dot:'#EF4444'};
}

function statusConfig(status) {
  if (status === 'approved') return {bg:'#F0FDF4', border:'#BBF7D0', text:'#15803D', label:'Approved', dot:'#22C55E'};
  if (status === 'rejected') return {bg:'#FEF2F2', border:'#FECACA', text:'#B91C1C', label:'Flagged', dot:'#EF4444'};
  return {bg:'#F8FAFC', border:'#E2E8F0', text:'#64748B', label:'Pending', dot:'#94A3B8'};
}

/* ─── Toast ──────────────────────────────────────────────────────────────── */
function Toast({msg, color}) {
  return (
    <div className={`toast fixed bottom-6 right-6 z-[200] flex items-center gap-2.5
                     px-4 py-3 rounded-xl text-sm font-semibold shadow-lg`}
         style={{background: color === 'green' ? '#15803D' : color === 'red' ? '#B91C1C' : '#1E3A8A', color:'white'}}>
      {color === 'green' && <span>✓</span>}
      {color === 'red' && <span>✕</span>}
      {msg}
    </div>
  );
}

/* ─── Stage 1: Upload ────────────────────────────────────────────────────── */
function UploadStage({onComplete}) {
  const [dragOver, setDragOver] = useState(false);
  const [file, setFile] = useState(null);
  const [questName, setQuestName] = useState('');
  const [custName, setCustName] = useState('');
  const [loading, setLoading] = useState(false);
  const [loadStep, setLoadStep] = useState(0); // 0=not started, 1,2,3=steps
  const inputRef = useRef(null);

  const LOAD_STEPS = [
    {icon:'📊', label:'Parsing Excel file', detail:'Extracting questions from spreadsheet…'},
    {icon:'🔍', label:'Querying Vector DB', detail:'Running similarity search via Voyage AI…'},
    {icon:'✨', label:'Generating Answers', detail:'Gemini 2.5 Flash composing responses…'},
  ];

  const handleFile = (f) => { if (f && f.name.endsWith('.xlsx')) setFile(f); };

  const handleStart = () => {
    if (!file || !questName.trim()) return;
    setLoading(true);
    setLoadStep(1);
    // Simulate steps — replace with real POST /questionnaires/upload
    setTimeout(() => setLoadStep(2), 2200);
    setTimeout(() => setLoadStep(3), 5000);
    setTimeout(() => { setLoading(false); onComplete(); }, 7800);
  };

  if (loading) {
    return (
      <div className="flex-1 flex flex-col items-center justify-center py-16 px-8">
        <div className="w-full max-w-lg">
          {/* Glowing file card */}
          <div className="bg-white rounded-2xl border border-blue-100 shadow-[0_0_40px_rgba(30,58,138,0.08)] p-6 mb-8 text-center">
            <div className="w-14 h-14 rounded-2xl mx-auto mb-4 flex items-center justify-center text-2xl"
                 style={{background:'#EFF6FF'}}>📄</div>
            <p className="font-bold text-slate-900">{file?.name}</p>
            <p className="text-sm text-slate-500 mt-0.5">{questName} · {custName || 'No customer'}</p>
          </div>

          {/* Step tracker */}
          <div className="space-y-3 mb-8">
            {LOAD_STEPS.map((step, i) => {
              const stepNum = i + 1;
              const isDone = loadStep > stepNum;
              const isActive = loadStep === stepNum;
              const isPending = loadStep < stepNum;
              return (
                <div key={i}
                     className={`flex items-center gap-4 p-4 rounded-xl border transition-all duration-500
                                 ${isDone ? 'bg-green-50 border-green-200'
                                  : isActive ? 'bg-blue-50 border-blue-200'
                                  : 'bg-white border-slate-100 opacity-50'}`}>
                  {/* Step indicator */}
                  <div className={`w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold shrink-0 transition-all
                                   ${isDone ? 'bg-green-500 text-white'
                                    : isActive ? 'text-white glow-pulse' : 'bg-slate-100 text-slate-400'}`}
                       style={isActive ? {background:NAVY} : {}}>
                    {isDone ? '✓' : isActive ? (
                      <svg className="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5">
                        <path strokeLinecap="round" d="M12 3a9 9 0 1 0 9 9"/>
                      </svg>
                    ) : stepNum}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className={`text-sm font-semibold ${isDone ? 'text-green-800' : isActive ? 'text-blue-900' : 'text-slate-400'}`}>
                      {step.icon} {step.label}
                    </p>
                    {isActive && <p className="text-xs text-blue-600 mt-0.5 font-medium">{step.detail}</p>}
                    {isDone && <p className="text-xs text-green-600 mt-0.5 font-medium">Complete</p>}
                  </div>
                  {isActive && (
                    <div className="flex gap-1 shrink-0">
                      {[0,1,2].map(d => (
                        <div key={d} className="w-1.5 h-1.5 rounded-full"
                             style={{background:NAVY, opacity: 0.4,
                               animation:`ping 1s ease-in-out ${d*0.2}s infinite`}}/>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Skeleton preview */}
          <div className="space-y-2.5">
            <p className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3">
              Preparing review workspace…
            </p>
            {[80,60,90,70].map((w,i) => (
              <div key={i} className="skeleton h-3 rounded-full" style={{width:`${w}%`, animationDelay:`${i*0.1}s`}}/>
            ))}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="flex-1 flex flex-col items-center justify-center py-12 px-8">
      <div className="w-full max-w-xl">
        <div className="text-center mb-8">
          <div className="w-14 h-14 rounded-2xl mx-auto mb-4 flex items-center justify-center"
               style={{background:NAVY}}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.8">
              <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/>
            </svg>
          </div>
          <h2 className="text-2xl font-black text-slate-900">Upload Security Questionnaire</h2>
          <p className="text-slate-500 text-sm mt-1.5">AI will automatically answer questions using your knowledge base</p>
        </div>

        {/* Form fields */}
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-5 space-y-4">
          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-1.5">Questionnaire name <span className="text-red-400">*</span></label>
            <input value={questName} onChange={e=>setQuestName(e.target.value)}
                   placeholder="e.g. MegaBank Vendor Assessment Q4 2024"
                   className="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none
                              focus:ring-2 focus:border-transparent placeholder:text-slate-300 font-medium text-slate-900"
                   style={{'--tw-ring-color': NAVY}}
                   onFocus={e=>e.target.style.boxShadow=`0 0 0 2px ${NAVY}33`}
                   onBlur={e=>e.target.style.boxShadow='none'}/>
          </div>
          <div>
            <label className="block text-sm font-semibold text-slate-700 mb-1.5">Customer name</label>
            <input value={custName} onChange={e=>setCustName(e.target.value)}
                   placeholder="e.g. MegaBank"
                   className="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none placeholder:text-slate-300 font-medium text-slate-900"
                   onFocus={e=>e.target.style.boxShadow=`0 0 0 2px ${NAVY}33`}
                   onBlur={e=>e.target.style.boxShadow='none'}/>
          </div>
        </div>

        {/* Drop zone */}
        <div className={`border-2 border-dashed rounded-2xl p-8 text-center cursor-pointer transition-all duration-150 mb-5
                         ${dragOver ? 'border-blue-400 bg-blue-50' : file ? 'border-green-400 bg-green-50' : 'border-slate-200 bg-white hover:border-slate-300'}`}
             onDragOver={e=>{e.preventDefault();setDragOver(true)}}
             onDragLeave={()=>setDragOver(false)}
             onDrop={e=>{e.preventDefault();setDragOver(false);handleFile(e.dataTransfer.files[0])}}
             onClick={()=>inputRef.current?.click()}>
          {file ? (
            <div className="flex flex-col items-center gap-2">
              <div className="w-12 h-12 rounded-xl bg-green-100 flex items-center justify-center text-xl">📊</div>
              <p className="font-bold text-green-800">{file.name}</p>
              <p className="text-xs text-green-600">{(file.size/1024).toFixed(1)} KB · Click to change</p>
            </div>
          ) : (
            <div className="flex flex-col items-center gap-3">
              <div className="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" strokeWidth="1.5">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/>
                </svg>
              </div>
              <div>
                <p className="text-sm font-semibold text-slate-700">Drop your Excel file here</p>
                <p className="text-xs text-slate-400 mt-0.5">or <span style={{color:NAVY}} className="font-bold">click to browse</span> · .xlsx only</p>
              </div>
            </div>
          )}
          <input ref={inputRef} type="file" accept=".xlsx" className="hidden" onChange={e=>handleFile(e.target.files[0])}/>
        </div>

        <button onClick={handleStart}
                disabled={!file || !questName.trim()}
                className="w-full py-3.5 rounded-xl text-sm font-bold text-white transition-all duration-150
                           disabled:opacity-40 disabled:cursor-not-allowed hover:opacity-90"
                style={{background: NAVY}}>
          ✦ Analyze & Generate Answers with AI
        </button>
        <p className="text-center text-xs text-slate-400 mt-2">Takes 15–30 seconds · Powered by Gemini 2.5 Flash + Voyage AI</p>
      </div>
    </div>
  );
}

/* ─── Confidence Badge ───────────────────────────────────────────────────── */
function ConfidenceBadge({score}) {
  const c = confidenceColor(score);
  return (
    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border"
          style={{background:c.bg, borderColor:c.border, color:c.text}}>
      <div className="w-2 h-2 rounded-full" style={{background:c.dot}}/>
      {score}% Match
    </span>
  );
}

/* ─── Sources Panel ──────────────────────────────────────────────────────── */
function SourcesPanel({sources, isOpen, onToggle}) {
  return (
    <div className="mt-4 border-t border-slate-100 pt-3">
      <button onClick={onToggle}
              className="flex items-center gap-2 text-xs font-semibold transition-colors w-full"
              style={{color: isOpen ? NAVY : '#94A3B8'}}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
        </svg>
        {isOpen ? 'Hide' : 'Show'} AI source references ({sources.length})
        {!isOpen && (
          <span className="ml-1 px-1.5 py-0.5 rounded text-[10px] font-bold"
                style={{background:'#EFF6FF', color:NAVY}}>
            {sources[0]?.doc.split('.')[0].substring(0,22)}…
          </span>
        )}
      </button>

      {isOpen && (
        <div className="mt-3 space-y-2.5">
          {sources.map((s, i) => (
            <div key={i} className="bg-slate-50 border border-slate-200 rounded-xl p-3.5">
              <div className="flex items-center justify-between gap-2 mb-2">
                <div className="flex items-center gap-1.5">
                  <span className="text-base">📄</span>
                  <span className="text-xs font-bold text-slate-700 truncate max-w-[200px]">{s.doc}</span>
                </div>
                <span className="text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0"
                      style={{background: s.score>=0.85?'#F0FDF4':'#FFFBEB',
                              color: s.score>=0.85?'#15803D':'#B45309',
                              border: `1px solid ${s.score>=0.85?'#86EFAC':'#FCD34D'}`}}>
                  {Math.round(s.score*100)}% sim
                </span>
              </div>
              <p className="text-xs text-slate-600 leading-relaxed italic border-l-2 pl-3"
                 style={{borderColor: NAVY+44}}>
                "{s.excerpt}"
              </p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ─── Question Card ──────────────────────────────────────────────────────── */
function QuestionCard({q, onApprove, onReject, isActive, animClass}) {
  const [showSources, setShowSources] = useState(false);
  const [answer, setAnswer] = useState(q.aiAnswer);
  const sc = statusConfig(q.status);
  const cc = confidenceColor(q.confidence);

  return (
    <div className={`bg-white rounded-2xl border shadow-sm overflow-hidden ${animClass || ''}`}
         style={{borderColor: isActive ? NAVY+'33' : '#E2E8F0',
                 boxShadow: isActive ? `0 0 0 2px ${NAVY}22, 0 4px 20px rgba(0,0,0,0.06)` : undefined}}>

      {/* Card header */}
      <div className="flex items-start justify-between gap-3 px-5 py-4"
           style={{background:'#F8FAFC', borderBottom:'1px solid #F1F5F9'}}>
        <div className="flex items-center gap-2.5 flex-wrap">
          <span className="text-xs font-bold px-2 py-0.5 rounded-md font-mono"
                style={{background:'#EFF6FF', color:NAVY, border:`1px solid ${NAVY}33`}}>
            Row {q.rowIndex}
          </span>
          {isActive && (
            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full"
                  style={{background:NAVY, color:'white'}}>
              CURRENT
            </span>
          )}
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <ConfidenceBadge score={q.confidence}/>
          <span className="inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-xs font-bold border"
                style={{background:sc.bg, borderColor:sc.border, color:sc.text}}>
            <div className={`w-1.5 h-1.5 rounded-full ${q.status==='pending'?'animate-pulse':''}`}
                 style={{background:sc.dot}}/>
            {sc.label}
          </span>
        </div>
      </div>

      <div className="px-5 py-4">
        {/* Question text */}
        <div className="mb-4">
          <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1.5">Question</p>
          <p className="text-sm text-slate-800 font-medium leading-relaxed">{q.question}</p>
        </div>

        {/* AI Answer textarea */}
        <div className="mb-1">
          <div className="flex items-center justify-between mb-1.5">
            <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400">AI-Generated Answer</p>
            <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full"
                  style={{background:'#EFF6FF', color:NAVY}}>✦ Editable</span>
          </div>
          <textarea
            value={answer}
            onChange={e => setAnswer(e.target.value)}
            rows={4}
            className="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800
                       leading-relaxed resize-y outline-none transition-all font-medium"
            style={{'fontFamily':'inherit'}}
            onFocus={e=>e.target.style.boxShadow=`0 0 0 2px ${NAVY}33`}
            onBlur={e=>e.target.style.boxShadow='none'}
          />
        </div>

        {/* Sources */}
        <SourcesPanel sources={q.sources} isOpen={showSources} onToggle={()=>setShowSources(!showSources)}/>
      </div>

      {/* Actions (only for active/pending) */}
      {isActive && q.status === 'pending' && (
        <div className="flex items-center gap-3 px-5 py-4 border-t border-slate-100 bg-slate-50/50">
          <button onClick={() => onApprove(q.id)}
                  className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-bold text-white transition-all duration-150 hover:opacity-90 active:scale-95"
                  style={{background:'#16A34A'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5">
              <path strokeLinecap="round" strokeLinejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
            </svg>
            Approve
            <span className="kbd ml-1">A</span>
          </button>

          <button onClick={() => onReject(q.id)}
                  className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-bold transition-all duration-150 hover:opacity-90 active:scale-95"
                  style={{background:'#FEF2F2', color:'#B91C1C', border:'1.5px solid #FECACA'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" strokeWidth="2.5">
              <path strokeLinecap="round" strokeLinejoin="round" d="M6 18 18 6M6 6l12 12"/>
            </svg>
            Flag for Review
            <span className="kbd ml-1">R</span>
          </button>

          <button className="px-3.5 py-2.5 rounded-xl text-sm font-semibold border border-slate-200
                             text-slate-500 hover:bg-white transition-all duration-150">
            Skip
            <span className="kbd ml-1.5">S</span>
          </button>
        </div>
      )}

      {/* Already actioned */}
      {q.status !== 'pending' && (
        <div className={`flex items-center gap-2 px-5 py-3 border-t`}
             style={{borderColor: q.status==='approved'?'#BBF7D0':'#FECACA',
                     background: q.status==='approved'?'#F0FDF4':'#FEF2F2'}}>
          {q.status === 'approved'
            ? <><span className="text-green-600 font-bold text-sm">✓ Approved</span><span className="text-xs text-green-500">— included in export</span></>
            : <><span className="text-red-600 font-bold text-sm">⚑ Flagged for Review</span><span className="text-xs text-red-400">— excluded from export</span></>
          }
        </div>
      )}
    </div>
  );
}

/* ─── Stage 2: Review Workspace ──────────────────────────────────────────── */
function ReviewStage({onComplete}) {
  const [questions, setQuestions] = useState(MOCK_QUESTIONS);
  const [filter, setFilter] = useState('pending');
  const [currentId, setCurrentId] = useState(MOCK_QUESTIONS[0].id);
  const [animMap, setAnimMap] = useState({});
  const [toast, setToast] = useState(null);
  const mainRef = useRef(null);
  const toastTimer = useRef(null);

  const showToast = (msg, color) => {
    setToast({msg, color});
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  };

  const pending = questions.filter(q => q.status === 'pending');
  const approved = questions.filter(q => q.status === 'approved');
  const rejected = questions.filter(q => q.status === 'rejected');

  const advanceToNext = useCallback(() => {
    const nextPending = pending.find(q => q.id !== currentId);
    if (nextPending) {
      setTimeout(() => setCurrentId(nextPending.id), 300);
    }
  }, [pending, currentId]);

  const handleApprove = useCallback((id) => {
    setAnimMap(prev => ({...prev, [id]:'approve-flash'}));
    setQuestions(prev => prev.map(q => q.id===id ? {...q, status:'approved'} : q));
    showToast('Answer approved ✓', 'green');
    advanceToNext();
    setTimeout(() => setAnimMap(prev => {const n={...prev}; delete n[id]; return n;}), 600);
  }, [advanceToNext]);

  const handleReject = useCallback((id) => {
    setAnimMap(prev => ({...prev, [id]:'reject-flash'}));
    setQuestions(prev => prev.map(q => q.id===id ? {...q, status:'rejected'} : q));
    showToast('Question flagged for review', 'red');
    advanceToNext();
    setTimeout(() => setAnimMap(prev => {const n={...prev}; delete n[id]; return n;}), 600);
  }, [advanceToNext]);

  // Keyboard shortcuts
  useEffect(() => {
    const handler = (e) => {
      if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
      const curr = questions.find(q => q.id === currentId);
      if (!curr || curr.status !== 'pending') return;
      if (e.key === 'a' || e.key === 'A') handleApprove(currentId);
      if (e.key === 'r' || e.key === 'R') handleReject(currentId);
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowRight') {
        const next = pending.find(q => q.id !== currentId);
        if (next) setCurrentId(next.id);
      }
      if (e.key === 'ArrowLeft') {
        const others = questions.filter(q => q.id !== currentId);
        const prev = [...others].reverse().find(q => q.id < currentId);
        if (prev) setCurrentId(prev.id);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [currentId, questions, pending, handleApprove, handleReject]);

  const filteredQ = filter === 'all' ? questions
    : filter === 'pending' ? pending
    : filter === 'approved' ? approved
    : rejected;

  const pct = Math.round(((approved.length + rejected.length) / questions.length) * 100);

  const FILTERS = [
    {key:'pending', label:'Pending', count: pending.length, color:'#F59E0B'},
    {key:'approved', label:'Approved', count: approved.length, color:'#22C55E'},
    {key:'rejected', label:'Flagged', count: rejected.length, color:'#EF4444'},
    {key:'all', label:'All', count: questions.length, color:NAVY},
  ];

  return (
    <div className="flex flex-1 overflow-hidden">

      {/* ── Left Sidebar ─────────────────────────────────────── */}
      <aside className="w-[260px] shrink-0 bg-white border-r border-slate-200 flex flex-col overflow-hidden">

        {/* Progress card */}
        <div className="p-4 border-b border-slate-100">
          <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-3">Overall Progress</p>
          <div className="flex items-end justify-between mb-2">
            <span className="text-3xl font-black" style={{color:NAVY}}>
              {approved.length + rejected.length}
            </span>
            <span className="text-slate-400 text-sm font-semibold pb-0.5">/ {questions.length} reviewed</span>
          </div>
          <div className="h-2 bg-slate-100 rounded-full overflow-hidden mb-3">
            <div className="pbar h-full rounded-full" style={{width:`${pct}%`, background:NAVY}}/>
          </div>

          {/* Mini stats */}
          <div className="grid grid-cols-2 gap-2">
            <div className="bg-green-50 border border-green-100 rounded-xl p-2.5 text-center">
              <p className="text-lg font-black text-green-700">{approved.length}</p>
              <p className="text-[10px] font-semibold text-green-600">Approved</p>
            </div>
            <div className="bg-red-50 border border-red-100 rounded-xl p-2.5 text-center">
              <p className="text-lg font-black text-red-600">{rejected.length}</p>
              <p className="text-[10px] font-semibold text-red-500">Flagged</p>
            </div>
          </div>
        </div>

        {/* Keyboard shortcuts hint */}
        <div className="px-4 py-3 bg-slate-50 border-b border-slate-100">
          <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Keyboard Shortcuts</p>
          <div className="space-y-1.5">
            {[['A','Approve current'],['R','Flag for review'],['S / →','Next question'],['← ','Previous']].map(([k,l])=>(
              <div key={k} className="flex items-center gap-2">
                <span className="kbd">{k}</span>
                <span className="text-xs text-slate-500 font-medium">{l}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Filter tabs */}
        <div className="px-3 py-3 border-b border-slate-100">
          {FILTERS.map(f => (
            <button key={f.key} onClick={() => setFilter(f.key)}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-semibold mb-1 transition-all
                                ${filter===f.key ? 'text-white' : 'text-slate-600 hover:bg-slate-50'}`}
                    style={filter===f.key ? {background:f.key==='all'?NAVY:
                             f.key==='approved'?'#16A34A':f.key==='rejected'?'#DC2626':'#D97706'} : {}}>
              {f.label}
              <span className={`text-xs font-bold px-2 py-0.5 rounded-full
                                ${filter===f.key ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-500'}`}>
                {f.count}
              </span>
            </button>
          ))}
        </div>

        {/* Question index list */}
        <div className="flex-1 overflow-y-auto py-2 px-2">
          {questions.map((q, i) => {
            const sc = statusConfig(q.status);
            const isActive = q.id === currentId;
            return (
              <button key={q.id} onClick={() => setCurrentId(q.id)}
                      className={`w-full text-left px-3 py-2.5 rounded-xl mb-1 flex items-center gap-2.5 transition-all
                                  ${isActive ? 'text-white' : 'hover:bg-slate-50 text-slate-700'}`}
                      style={isActive ? {background:NAVY} : {}}>
                <div className="w-5 h-5 rounded-full flex items-center justify-center shrink-0"
                     style={{background: isActive ? 'white' : sc.bg, border:`1px solid ${sc.border}`}}>
                  <div className="w-2 h-2 rounded-full" style={{background: isActive ? NAVY : sc.dot}}/>
                </div>
                <span className="text-xs font-semibold truncate flex-1">Q{i+1} · Row {q.rowIndex}</span>
                {q.status !== 'pending' && (
                  <span className="text-[10px]">{q.status==='approved'?'✓':'⚑'}</span>
                )}
              </button>
            );
          })}
        </div>

        {/* Export when done */}
        {pending.length === 0 && (
          <div className="p-4 border-t border-slate-100">
            <button onClick={onComplete}
                    className="w-full py-3 rounded-xl text-sm font-bold text-white hover:opacity-90 transition-all"
                    style={{background:'#16A34A'}}>
              ↓ Export Approved Answers
            </button>
          </div>
        )}
      </aside>

      {/* ── Main question list ────────────────────────────────── */}
      <main ref={mainRef} className="flex-1 overflow-y-auto bg-[#F8FAFC]">
        <div className="max-w-2xl mx-auto px-6 py-6 space-y-5">

          {/* Header */}
          <div className="flex items-center justify-between">
            <div>
              <p className="text-xs font-bold uppercase tracking-widest text-slate-400">
                {filter==='all'?'All Questions':filter==='pending'?'Awaiting Review':filter==='approved'?'Approved':' Flagged for Review'}
              </p>
              <h2 className="text-lg font-black text-slate-900 mt-0.5">
                {filteredQ.length} question{filteredQ.length!==1?'s':''}
              </h2>
            </div>
            {pending.length > 0 && (
              <div className="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold"
                   style={{background:'#FFF7ED', border:'1px solid #FED7AA', color:'#C2410C'}}>
                <div className="w-2 h-2 rounded-full bg-orange-400 animate-pulse"/>
                {pending.length} pending · use A/R keys
              </div>
            )}
            {pending.length === 0 && (
              <div className="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold"
                   style={{background:'#F0FDF4', border:'1px solid #BBF7D0', color:'#15803D'}}>
                ✓ All reviewed — ready to export
              </div>
            )}
          </div>

          {/* Question cards */}
          {filteredQ.length === 0 ? (
            <div className="text-center py-20 text-slate-400">
              <p className="text-4xl mb-3">✓</p>
              <p className="font-semibold">No questions here</p>
            </div>
          ) : filteredQ.map(q => (
            <QuestionCard
              key={q.id}
              q={q}
              onApprove={handleApprove}
              onReject={handleReject}
              isActive={q.id === currentId && q.status === 'pending'}
              animClass={animMap[q.id]}
            />
          ))}

          {/* Bottom CTA */}
          {pending.length === 0 && (
            <div className="bg-white rounded-2xl border border-green-200 p-6 text-center shadow-sm"
                 style={{boxShadow:'0 0 30px rgba(22,163,74,0.08)'}}>
              <p className="text-3xl mb-2">🎉</p>
              <p className="text-base font-black text-slate-900">All questions reviewed!</p>
              <p className="text-sm text-slate-500 mt-1 mb-4">{approved.length} approved · {rejected.length} flagged</p>
              <button onClick={onComplete}
                      className="px-6 py-3 rounded-xl text-sm font-bold text-white hover:opacity-90 transition-all"
                      style={{background:'#16A34A'}}>
                ↓ Download Approved Excel File
              </button>
            </div>
          )}
        </div>
      </main>

      {toast && <Toast msg={toast.msg} color={toast.color}/>}
    </div>
  );
}

/* ─── Stage 3: Export ────────────────────────────────────────────────────── */
function ExportStage({onRestart}) {
  const approved = MOCK_QUESTIONS.filter(q=>q.status!=='rejected').length;
  return (
    <div className="flex-1 flex items-center justify-center py-16">
      <div className="max-w-md w-full text-center px-8">
        <div className="w-20 h-20 rounded-3xl mx-auto mb-6 flex items-center justify-center text-4xl"
             style={{background:'#F0FDF4', border:'2px solid #BBF7D0'}}>
          📥
        </div>
        <h2 className="text-2xl font-black text-slate-900 mb-2">Export Ready</h2>
        <p className="text-slate-500 text-sm mb-8 leading-relaxed">
          Your approved answers have been written back into the original Excel format, preserving all formatting, merged cells, and formulas.
        </p>

        <div className="grid grid-cols-3 gap-3 mb-8">
          {[
            {label:'Approved', val: approved, color:'#16A34A', bg:'#F0FDF4'},
            {label:'Flagged', val: MOCK_QUESTIONS.length - approved, color:'#DC2626', bg:'#FEF2F2'},
            {label:'Total', val: MOCK_QUESTIONS.length, color: NAVY, bg:'#EFF6FF'},
          ].map(s => (
            <div key={s.label} className="rounded-2xl p-4 border text-center"
                 style={{background:s.bg, borderColor:s.color+'44'}}>
              <p className="text-2xl font-black" style={{color:s.color}}>{s.val}</p>
              <p className="text-xs font-semibold text-slate-500 mt-0.5">{s.label}</p>
            </div>
          ))}
        </div>

        <div className="space-y-3">
          <button className="w-full py-3.5 rounded-xl text-sm font-bold text-white hover:opacity-90 transition-all"
                  style={{background:'#16A34A'}}>
            ↓ Download Excel (Approved Answers Only)
          </button>
          <button className="w-full py-3.5 rounded-xl text-sm font-bold border text-slate-600 hover:bg-slate-50 transition-all border-slate-200">
            ↓ Download PDF Report
          </button>
          <button onClick={onRestart}
                  className="w-full py-3 rounded-xl text-sm font-semibold text-slate-400 hover:text-slate-600 transition-all">
            ← Start a new questionnaire
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─── Wizard Steps Header ────────────────────────────────────────────────── */
function WizardHeader({step}) {
  const STEPS = [
    {n:1, label:'Upload & Settings'},
    {n:2, label:'AI Review Workspace'},
    {n:3, label:'Export'},
  ];
  return (
    <header className="bg-white border-b border-slate-200 px-6 h-[60px] flex items-center gap-6 shadow-sm shrink-0">
      {/* Logo */}
      <div className="flex items-center gap-2.5 shrink-0 mr-4">
        <div className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:NAVY}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/>
          </svg>
        </div>
        <span className="text-sm font-black text-slate-900">Sentinel GRC</span>
      </div>

      <div className="h-5 w-px bg-slate-200"/>

      {/* Steps */}
      <div className="flex items-center gap-2 flex-1">
        {STEPS.map((s, i) => (
          <div key={s.n} className="flex items-center gap-2">
            {i > 0 && <div className={`h-px w-8 ${step>i?'bg-blue-900':'bg-slate-200'}`}/>}
            <div className={`flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold transition-all
                             ${step===s.n ? 'text-white' : step>s.n ? 'text-green-700' : 'text-slate-400'}`}
                 style={step===s.n ? {background:NAVY} : step>s.n ? {background:'#F0FDF4',border:'1px solid #BBF7D0'} : {background:'#F8FAFC'}}>
              <div className={`w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-black
                               ${step===s.n ? 'bg-white/20' : step>s.n ? 'bg-green-100' : 'bg-slate-200'}`}
                   style={step===s.n ? {color:'white'} : step>s.n ? {color:'#16A34A'} : {color:'#94A3B8'}}>
                {step>s.n ? '✓' : s.n}
              </div>
              {s.label}
            </div>
          </div>
        ))}
      </div>

      {/* Help hint */}
      {step===2 && (
        <div className="flex items-center gap-1.5 text-xs text-slate-400 font-medium shrink-0">
          <span className="kbd">A</span> Approve
          <span className="kbd ml-1">R</span> Flag
          <span className="kbd ml-1">S</span> Skip
        </div>
      )}
    </header>
  );
}

/* ─── App ────────────────────────────────────────────────────────────────── */
function App() {
  const [step, setStep] = useState(1);
  return (
    <div className="h-screen flex flex-col overflow-hidden">
      <WizardHeader step={step}/>
      {step === 1 && <UploadStage onComplete={() => setStep(2)}/>}
      {step === 2 && <ReviewStage onComplete={() => setStep(3)}/>}
      {step === 3 && <ExportStage onRestart={() => setStep(1)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<style>
  @keyframes ping{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.4);opacity:1}}
</style>
</body>
