    @keyframes toastOut{0%{opacity:1}80%{opacity:1}100%{opacity:0;pointer-events:none}}

// ─── Status helpers ──────────────────────────────────────────────────────────
function getSectionStatus(section, responses) {
  const answered = section.questions.filter(q => responses[q.id]?.answer).length;
  if (answered === 0) return 'not-started';
  if (answered === section.questions.length) return 'completed';
  return 'in-progress';
}

function formatTime(date) {
  return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatFileSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1048576) return `${(bytes/1024).toFixed(1)} KB`;
  return `${(bytes/1048576).toFixed(1)} MB`;
}

                    shadow-[0_8px_30px_rgba(0,0,0,0.3)]">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
      </svg>
      <span>Auto-saved at {time}</span>
    </div>
  );
}

        <button className="flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-semibold text-white transition-all duration-150 hover:opacity-90"
                style={{background:'#1E3A8A'}}>
          <Icon name="pdf" size={14} color="white"/>
          Export PDF
        </button>
      </div>
    </header>
  );
}

// ─── Sidebar ─────────────────────────────────────────────────────────────────
function Sidebar({ sections, activeId, onSelect, responses }) {
  const totalAnswered = sections.reduce((sum, s) =>
    sum + s.questions.filter(q => responses[q.id]?.answer).length, 0);
  const totalQ = sections.reduce((sum, s) => sum + s.questions.length, 0);

  return (
    <aside className="w-[272px] shrink-0 bg-white border-r border-slate-200 flex flex-col overflow-hidden"
           style={{height:'calc(100vh - 68px)'}}>
      {/* Sidebar header */}
      <div className="px-4 py-4 border-b border-slate-100">
        <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Assessment Domains</p>
        <div className="flex items-center justify-between">
          <p className="text-xs text-slate-500 font-medium">{sections.length} sections</p>
          <div className="flex items-center gap-1.5">
            <div className="w-2 h-2 rounded-full bg-green-500"/>
            <span className="text-xs text-slate-500">{sections.filter(s => getSectionStatus(s, responses) === 'completed').length} done</span>
          </div>
        </div>
      </div>

      {/* Section list */}
      <div className="flex-1 overflow-y-auto py-2">
        {sections.map((section, idx) => {
          const status = getSectionStatus(section, responses);
          const answered = section.questions.filter(q => responses[q.id]?.answer).length;
          const isActive = section.id === activeId;
          return (
            <button key={section.id} onClick={() => onSelect(section.id)}
                    className={`sidebar-item w-full text-left px-4 py-3 flex items-start gap-3 border-l-[3px] transition-all duration-150
                      ${isActive
                        ? 'border-l-[#1E3A8A] bg-blue-50'
                        : 'border-l-transparent hover:bg-slate-50'
                      }`}>
              {/* Icon */}
              <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 mt-0.5
                               ${isActive ? 'bg-[#1E3A8A]' : 'bg-slate-100'}`}>
                <Icon name={section.icon} size={14} color={isActive ? 'white' : '#64748B'}/>
              </div>
              {/* Text */}
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between gap-2 mb-0.5">
                  <span className={`text-xs font-bold uppercase tracking-wide
                                   ${isActive ? 'text-[#1E3A8A]' : 'text-slate-400'}`}>
                    {section.code}
                  </span>
                  {status === 'completed' && (
                    <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-green-50 text-green-700 border border-green-200">
                      <div className="w-1.5 h-1.5 rounded-full bg-green-500"/>
                      Done
                    </span>
                  )}
                  {status === 'in-progress' && (
                    <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">
                      <div className="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"/>
                      Active
                    </span>
                  )}
                </div>
                <p className={`text-sm font-semibold leading-tight mb-1.5
                              ${isActive ? 'text-slate-900' : 'text-slate-700'}`}>
                  {section.title}
                </p>
                {/* Mini progress */}
                <div className="flex items-center gap-2">
                  <div className="flex-1 h-1 bg-slate-100 rounded-full overflow-hidden">
                    <div className="h-full rounded-full transition-all duration-500"
                         style={{
                           width: `${(answered / section.questions.length) * 100}%`,
                           background: status === 'completed' ? '#16A34A' : isActive ? '#1E3A8A' : '#94A3B8'
                         }}/>
                  </div>
                  <span className="text-[10px] font-semibold text-slate-400 shrink-0">
                    {answered}/{section.questions.length}
                  </span>
                </div>
              </div>
            </button>
          );
        })}
      </div>

      {/* Sidebar footer */}
      <div className="px-4 py-3 border-t border-slate-100 bg-slate-50">
        <div className="flex items-center justify-between text-xs font-medium text-slate-500">
          <span>Overall progress</span>
          <span className="font-bold" style={{color:'#1E3A8A'}}>
            {Math.round((totalAnswered/totalQ)*100)}%
          </span>
        </div>
        <div className="h-1.5 bg-slate-200 rounded-full mt-1.5 overflow-hidden">
          <div className="progress-bar h-full rounded-full"
               style={{width:`${(totalAnswered/totalQ)*100}%`, background:'#1E3A8A'}}/>
        </div>
      </div>
    </aside>
  );
}

// ─── Evidence Upload Zone ────────────────────────────────────────────────────
function EvidenceUpload({ questionId, files, onFileDrop, isDragOver, onDragOver }) {
  const inputRef = useRef(null);

  const handleDrop = (e) => {
    e.preventDefault();
    onDragOver(null);
    onFileDrop(questionId, e.dataTransfer.files);
  };

  const handleFileChange = (e) => {
    if (e.target.files.length) onFileDrop(questionId, e.target.files);
    e.target.value = '';
  };

  const fileIcons = { 'application/pdf': '📄', 'image/': '🖼️', default: '📎' };
  const getFileIcon = (type) => {
    for (const [key, icon] of Object.entries(fileIcons)) {
      if (type.startsWith(key)) return icon;
    }
    return fileIcons.default;
  };

  return (
    <div className="fade-in mt-4">
      <div className="flex items-center gap-2 mb-2">
        <Icon name="paperClip" size={13} color="#64748B"/>
        <span className="text-xs font-semibold text-slate-600 uppercase tracking-wide">Evidence Upload</span>
        <span className="text-xs text-slate-400 font-medium">— attach supporting documentation</span>
      </div>
      <div
        className={`evidence-zone border-2 border-dashed rounded-xl p-5 text-center cursor-pointer
                    ${isDragOver === questionId
                      ? 'border-[#1E3A8A] bg-blue-50'
                      : 'border-slate-200 bg-slate-50 hover:border-slate-300 hover:bg-white'
                    }`}
        onDragOver={(e) => { e.preventDefault(); onDragOver(questionId); }}
        onDragLeave={() => onDragOver(null)}
        onDrop={handleDrop}
        onClick={() => inputRef.current?.click()}
        role="button" tabIndex={0}
        onKeyDown={(e) => e.key === 'Enter' && inputRef.current?.click()}
        aria-label="Upload evidence files"
      >
        <div className="flex flex-col items-center gap-2">
          <div className={`w-10 h-10 rounded-xl flex items-center justify-center
                          ${isDragOver === questionId ? 'bg-[#1E3A8A]' : 'bg-white border border-slate-200'}`}>
            <Icon name="upload" size={18} color={isDragOver === questionId ? 'white' : '#1E3A8A'}/>
          </div>
          <div>
            <p className="text-sm font-semibold text-slate-700">
              {isDragOver === questionId ? 'Drop files here' : 'Drag & drop files here'}
            </p>
            <p className="text-xs text-slate-400 mt-0.5">
              or <span style={{color:'#1E3A8A'}} className="font-semibold">click to browse</span>
              {' '}· PDF, DOCX, XLSX, PNG up to 25MB
            </p>
          </div>
        </div>
        <input ref={inputRef} type="file" multiple className="hidden"
               accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.txt"
               onChange={handleFileChange}/>
      </div>

      {/* Uploaded files */}
      {files && files.length > 0 && (
        <div className="mt-2 space-y-1.5">
          {files.map((f, i) => (
            <div key={i} className="flex items-center gap-2.5 bg-white border border-slate-200
                                    rounded-lg px-3 py-2 text-xs">
              <span className="text-base">{getFileIcon(f.type)}</span>
              <span className="font-medium text-slate-700 flex-1 truncate">{f.name}</span>
              <span className="text-slate-400 shrink-0">{formatFileSize(f.size)}</span>
              <div className="w-4 h-4 rounded-full bg-green-100 flex items-center justify-center shrink-0">
                <Icon name="check" size={10} color="#16A34A"/>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Comments Panel ──────────────────────────────────────────────────────────
function CommentsPanel({ questionId, isOpen, onToggle, noteInput, onNoteInput, onNoteAdd, notes }) {
  const textareaRef = useRef(null);
  const existingNotes = notes || [];

  useEffect(() => {
    if (isOpen && textareaRef.current) textareaRef.current.focus();
  }, [isOpen]);

  return (
    <div className="mt-4 border-t border-slate-100 pt-3">
      <button
        onClick={onToggle}
        className="flex items-center gap-2 text-xs font-semibold text-slate-500 hover:text-slate-700 transition-colors w-full"
        aria-expanded={isOpen}
      >
        <Icon name="note" size={13} color={isOpen ? '#1E3A8A' : '#94A3B8'}/>
        <span style={isOpen ? {color:'#1E3A8A'} : {}}>
          Comments & Internal Notes
          {existingNotes.length > 0 && (
            <span className="ml-1.5 inline-flex items-center justify-center w-4 h-4 rounded-full text-[10px] font-bold text-white"
                  style={{background:'#1E3A8A'}}>
              {existingNotes.length}
            </span>
          )}
        </span>
        <Icon name={isOpen ? 'chevronDown' : 'chevronRight'} size={12} color={isOpen ? '#1E3A8A' : '#94A3B8'}/>
      </button>

      {isOpen && (
        <div className="fade-in mt-3 space-y-2.5">
          {/* Existing notes */}
          {existingNotes.map((note, i) => (
            <div key={i} className="bg-amber-50 border border-amber-100 rounded-lg px-3 py-2.5">
              <div className="flex items-start justify-between gap-2 mb-1">
                <div className="flex items-center gap-1.5">
                  <div className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold text-white shrink-0"
                       style={{background:'#1E3A8A'}}>A</div>
                  <span className="text-xs font-semibold text-slate-700">Assessor</span>
                </div>
                <span className="text-[10px] text-slate-400 font-medium shrink-0">
                  {formatTime(note.time)}
                </span>
              </div>
              <p className="text-xs text-slate-700 leading-relaxed pl-7">{note.text}</p>
            </div>
          ))}

          {/* New note input */}
          <div className="bg-slate-50 border border-slate-200 rounded-xl overflow-hidden focus-within:border-[#1E3A8A] focus-within:ring-2 focus-within:ring-blue-100 transition-all">
            <textarea
              ref={textareaRef}
              value={noteInput || ''}
              onChange={(e) => onNoteInput(questionId, e.target.value)}
              placeholder="Add an internal note, finding, or recommendation…"
              rows={3}
              className="w-full px-3 py-2.5 text-xs text-slate-800 bg-transparent border-none outline-none resize-none placeholder:text-slate-400 font-medium"
              onKeyDown={(e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) onNoteAdd(questionId);
              }}
            />
            <div className="flex items-center justify-between px-3 py-2 bg-white border-t border-slate-100">
              <span className="text-[10px] text-slate-400">Ctrl+Enter to save · Visible to assessors only</span>
              <button
                onClick={() => onNoteAdd(questionId)}
                disabled={!noteInput?.trim()}
                className="px-3 py-1 rounded-lg text-xs font-semibold text-white transition-all duration-150
                           disabled:opacity-40 disabled:cursor-not-allowed"
                style={{background:'#1E3A8A'}}
              >
                Add Note
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Radio Options ────────────────────────────────────────────────────────────
function ResponseOptions({ questionId, currentAnswer, onResponse }) {
  return (
    <div className="grid grid-cols-2 gap-2.5 mt-4" role="radiogroup"
         aria-label="Compliance status for this control">
      {RESPONSE_OPTIONS.map((opt) => {
        const isSelected = currentAnswer === opt.value;
        return (
          <label key={opt.value}
                 className={`radio-card flex items-start gap-3 p-3.5 rounded-xl border-2 cursor-pointer
                             ${isSelected
                               ? 'shadow-sm'
                               : 'border-slate-200 bg-white hover:border-slate-300 hover:bg-slate-50'
                             }`}
                 style={isSelected ? {
                   borderColor: opt.borderColor,
                   backgroundColor: opt.bgColor,
                 } : {}}>
            <input type="radio" name={`q-${questionId}`} value={opt.value}
                   checked={isSelected} onChange={() => onResponse(questionId, opt.value)}
                   className="mt-0.5 shrink-0" style={{accentColor: opt.dotColor}}/>
            <div>
              <div className="flex items-center gap-1.5 mb-0.5">
                <div className="w-2 h-2 rounded-full shrink-0" style={{background: opt.dotColor}}/>
                <span className={`text-sm font-semibold ${isSelected ? '' : 'text-slate-700'}`}
                      style={isSelected ? {color: opt.textColor} : {}}>
                  {opt.label}
                </span>
              </div>
              <p className="text-xs text-slate-400 leading-snug">
                {opt.value === 'compliant' && 'Control is fully implemented and effective'}
                {opt.value === 'non-compliant' && 'Control is absent or ineffective'}
                {opt.value === 'partial' && 'Control is partially implemented'}
                {opt.value === 'na' && 'Control is not applicable to this environment'}
              </p>
            </div>
          </label>
        );
      })}
    </div>
  );
}

// ─── Question Card ────────────────────────────────────────────────────────────
function QuestionCard({
  question, sectionIndex, questionIndex,
  response, isNotesOpen, noteInput,
  uploadedFiles, dragOverQ,
  onResponse, onToggleNotes, onNoteInput, onNoteAdd, onFileDrop, onDragOver
}) {
  const [showGuidance, setShowGuidance] = useState(false);
  const optionData = RESPONSE_OPTIONS.find(o => o.value === response?.answer);

  return (
    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden"
         id={`question-${question.id}`}>
      {/* Card header */}
      <div className="flex items-start justify-between gap-4 px-6 py-5 border-b border-slate-100"
           style={{background:'#F8FAFC'}}>
        <div className="flex items-start gap-3 min-w-0">
          <div className="w-7 h-7 rounded-lg text-xs font-bold text-white flex items-center justify-center shrink-0 mt-0.5"
               style={{background:'#1E3A8A'}}>
            {questionIndex + 1}
          </div>
          <div>
            <div className="flex items-center gap-2 flex-wrap mb-1">
              <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold border"
                    style={{background:'#EFF6FF', borderColor:'#BFDBFE', color:'#1E40AF'}}>
                {question.controlId}
              </span>
              <h3 className="text-sm font-bold text-slate-900">{question.title}</h3>
            </div>
          </div>
        </div>
        {/* Status badge */}
        {optionData && (
          <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold shrink-0 border"
               style={{background:optionData.bgColor, borderColor:optionData.borderColor, color:optionData.textColor}}>
            <div className="w-1.5 h-1.5 rounded-full" style={{background:optionData.dotColor}}/>
            {optionData.label}
          </div>
        )}
      </div>

      <div className="px-6 py-5">
        {/* Question text */}
        <p className="text-sm text-slate-700 leading-relaxed">{question.text}</p>

        {/* Guidance toggle */}
        <button onClick={() => setShowGuidance(!showGuidance)}
                className="mt-2 flex items-center gap-1.5 text-xs font-semibold transition-colors"
                style={{color: showGuidance ? '#1E3A8A' : '#94A3B8'}}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" strokeWidth="2">
            <circle cx="12" cy="12" r="10"/>
            <path strokeLinecap="round" d="M12 16v-4m0-4h.01"/>
          </svg>
          {showGuidance ? 'Hide' : 'Show'} assessor guidance
          <Icon name={showGuidance ? 'chevronDown' : 'chevronRight'} size={11}/>
        </button>
        {showGuidance && (
          <div className="fade-in mt-2 bg-blue-50 border border-blue-100 rounded-xl px-4 py-3">
            <p className="text-xs text-blue-800 leading-relaxed font-medium">{question.guidance}</p>
          </div>
        )}

        {/* Response options */}
        <ResponseOptions
          questionId={question.id}
          currentAnswer={response?.answer}
          onResponse={onResponse}
        />

        {/* Conditional evidence upload */}
        {response?.answer && (
          <EvidenceUpload
            questionId={question.id}
            files={uploadedFiles[question.id]}
            onFileDrop={onFileDrop}
            isDragOver={dragOverQ}
            onDragOver={onDragOver}
          />
        )}

        {/* Comments section */}
        <CommentsPanel
          questionId={question.id}
          isOpen={isNotesOpen}
          onToggle={() => onToggleNotes(question.id)}
          noteInput={noteInput}
          onNoteInput={onNoteInput}
          onNoteAdd={onNoteAdd}
          notes={response?.notes}
        />
      </div>
    </div>
  );
}

// ─── Question Area ────────────────────────────────────────────────────────────
function QuestionArea({
  sections, activeId, responses, expandedNotes, noteInputs,
  uploadedFiles, dragOverQ,
  onResponse, onToggleNotes, onNoteInput, onNoteAdd, onFileDrop, onDragOver, onSectionChange
}) {
  const sectionIndex = sections.findIndex(s => s.id === activeId);
  const section = sections[sectionIndex];
  const prevSection = sections[sectionIndex - 1];
  const nextSection = sections[sectionIndex + 1];
  const status = getSectionStatus(section, responses);
  const answered = section.questions.filter(q => responses[q.id]?.answer).length;

  if (!section) return null;

  return (
    <main className="flex-1 overflow-y-auto" style={{height:'calc(100vh - 68px)'}}>
      <div className="max-w-3xl mx-auto px-8 py-7">

        {/* Section header */}
        <div className="mb-7">
          <div className="flex items-start justify-between gap-4">
            <div>
              <div className="flex items-center gap-2.5 mb-2">
                <span className="text-xs font-bold uppercase tracking-widest text-slate-400">{section.code}</span>
                <span className="text-slate-300">·</span>
                <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-bold border
                                  ${status === 'completed' ? 'bg-green-50 text-green-700 border-green-200'
                                   : status === 'in-progress' ? 'bg-amber-50 text-amber-700 border-amber-200'
                                   : 'bg-slate-100 text-slate-500 border-slate-200'}`}>
                  <div className={`w-1.5 h-1.5 rounded-full
                                   ${status === 'completed' ? 'bg-green-500'
                                    : status === 'in-progress' ? 'bg-amber-400 animate-pulse'
                                    : 'bg-slate-400'}`}/>
                  {status === 'completed' ? 'Completed' : status === 'in-progress' ? 'In Progress' : 'Not Started'}
                </span>
              </div>
              <h1 className="text-2xl font-black text-slate-900 tracking-tight">{section.title}</h1>
              <p className="text-sm text-slate-500 mt-1.5">
                {answered} of {section.questions.length} questions answered in this domain
              </p>
            </div>
            {/* Section progress ring */}
            <div className="shrink-0 relative w-14 h-14">
              <svg width="56" height="56" viewBox="0 0 56 56" style={{transform:'rotate(-90deg)'}}>
                <circle cx="28" cy="28" r="23" fill="none" stroke="#E2E8F0" strokeWidth="4"/>
                <circle cx="28" cy="28" r="23" fill="none"
                        stroke={status === 'completed' ? '#16A34A' : '#1E3A8A'}
                        strokeWidth="4" strokeLinecap="round"
                        strokeDasharray={`${2 * Math.PI * 23}`}
                        strokeDashoffset={`${2 * Math.PI * 23 * (1 - answered/section.questions.length)}`}
                        style={{transition:'stroke-dashoffset .5s ease'}}/>
              </svg>
              <span className="absolute inset-0 flex items-center justify-center text-xs font-black"
                    style={{color: status === 'completed' ? '#16A34A' : '#1E3A8A'}}>
                {Math.round((answered/section.questions.length)*100)}%
              </span>
            </div>
          </div>

          {/* Section progress bar */}
          <div className="h-1.5 bg-slate-100 rounded-full mt-4 overflow-hidden">
            <div className="progress-bar h-full rounded-full"
                 style={{
                   width:`${(answered/section.questions.length)*100}%`,
                   background: status === 'completed' ? '#16A34A' : '#1E3A8A'
                 }}/>
          </div>
        </div>

        {/* Question cards */}
        <div className="space-y-5">
          {section.questions.map((question, qi) => (
            <QuestionCard
              key={question.id}
              question={question}
              sectionIndex={sectionIndex}
              questionIndex={qi}
              response={responses[question.id]}
              isNotesOpen={expandedNotes.has(question.id)}
              noteInput={noteInputs[question.id] || ''}
              uploadedFiles={uploadedFiles}
              dragOverQ={dragOverQ}
              onResponse={onResponse}
              onToggleNotes={onToggleNotes}
              onNoteInput={onNoteInput}
              onNoteAdd={onNoteAdd}
              onFileDrop={onFileDrop}
              onDragOver={onDragOver}
            />
          ))}
        </div>

        {/* Section completion banner */}
        {status === 'completed' && (
          <div className="fade-in mt-5 bg-green-50 border border-green-200 rounded-2xl px-5 py-4 flex items-center gap-4">
            <div className="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center shrink-0">
              <Icon name="check" size={18} color="#16A34A"/>
            </div>
            <div>
              <p className="text-sm font-bold text-green-800">All questions answered</p>
              <p className="text-xs text-green-600 mt-0.5">You can proceed to the next section or review your responses above.</p>
            </div>
          </div>
        )}

        {/* Navigation */}
        <div className="flex items-center justify-between mt-8 pt-6 border-t border-slate-100">
          <div>
            {prevSection ? (
              <button onClick={() => onSectionChange(prevSection.id)}
                      className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-all">
                <Icon name="arrowLeft" size={15}/>
                {prevSection.title}
              </button>
            ) : <div/>}
          </div>
          <div className="text-xs font-medium text-slate-400">
            Section {sectionIndex + 1} of {sections.length}
          </div>
          <div>
            {nextSection ? (
              <button onClick={() => onSectionChange(nextSection.id)}
                      className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold text-white hover:opacity-90 transition-all"
                      style={{background:'#1E3A8A'}}>
                {nextSection.title}
                <Icon name="arrowRight" size={15} color="white"/>
              </button>
            ) : (
              <button className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold text-white hover:opacity-90 transition-all"
                      style={{background:'#16A34A'}}>
                <Icon name="check" size={15} color="white"/>
                Complete Assessment
              </button>
            )}
          </div>
        </div>
      </div>
    </main>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [activeSection, setActiveSection] = useState('access-control');
  const [responses, setResponses] = useState({});
  const [expandedNotes, setExpandedNotes] = useState(new Set());
  const [noteInputs, setNoteInputs] = useState({});
  const [uploadedFiles, setUploadedFiles] = useState({});
  const [dragOverQ, setDragOverQ] = useState(null);
  const [saveStatus, setSaveStatus] = useState('saved');
  const [lastSaved, setLastSaved] = useState(new Date());
  const [showToast, setShowToast] = useState(false);
  const saveTimer = useRef(null);
  const toastTimer = useRef(null);

  const totalQ = SECTIONS.reduce((s, sec) => s + sec.questions.length, 0);
  const answeredQ = Object.keys(responses).filter(id => responses[id]?.answer).length;

  const triggerSave = useCallback(() => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStatus('saving');
    saveTimer.current = setTimeout(() => {
      const now = new Date();
      setSaveStatus('saved');
      setLastSaved(now);
      if (toastTimer.current) clearTimeout(toastTimer.current);
      setShowToast(true);
      toastTimer.current = setTimeout(() => setShowToast(false), 3800);
    }, 1200);
  }, []);

  const handleResponse = useCallback((qId, answer) => {
    setResponses(prev => ({ ...prev, [qId]: { ...(prev[qId] || {}), answer } }));
    setSaveStatus('unsaved');
    triggerSave();
  }, [triggerSave]);

  const handleToggleNotes = useCallback((qId) => {
    setExpandedNotes(prev => {
      const next = new Set(prev);
      next.has(qId) ? next.delete(qId) : next.add(qId);
      return next;
    });
  }, []);

  const handleNoteAdd = useCallback((qId) => {
    const text = noteInputs[qId]?.trim();
    if (!text) return;
    setResponses(prev => ({
      ...prev,
      [qId]: { ...(prev[qId] || {}), notes: [...(prev[qId]?.notes || []), { text, time: new Date() }] }
    }));
    setNoteInputs(prev => ({ ...prev, [qId]: '' }));
    setSaveStatus('unsaved');
    triggerSave();
  }, [noteInputs, triggerSave]);

  const handleFileDrop = useCallback((qId, files) => {
    const arr = Array.from(files).slice(0, 5);
    setUploadedFiles(prev => ({
      ...prev,
      [qId]: [...(prev[qId] || []), ...arr.map(f => ({ name: f.name, size: f.size, type: f.type }))]
    }));
    setSaveStatus('unsaved');
    triggerSave();
  }, [triggerSave]);

  return (
    <div className="h-screen flex flex-col overflow-hidden" style={{fontFamily:"'Inter',system-ui,sans-serif"}}>
      <Header
        totalQ={totalQ}
        answeredQ={answeredQ}
        saveStatus={saveStatus}
        lastSaved={lastSaved}
      />
      <div className="flex flex-1 overflow-hidden">
        <Sidebar
          sections={SECTIONS}
          activeId={activeSection}
          onSelect={setActiveSection}
          responses={responses}
        />
        <QuestionArea
          sections={SECTIONS}
          activeId={activeSection}
          responses={responses}
          expandedNotes={expandedNotes}
          noteInputs={noteInputs}
          uploadedFiles={uploadedFiles}
          dragOverQ={dragOverQ}
          onResponse={handleResponse}
          onToggleNotes={handleToggleNotes}
          onNoteInput={(qId, val) => setNoteInputs(prev => ({ ...prev, [qId]: val }))}
          onNoteAdd={handleNoteAdd}
          onFileDrop={handleFileDrop}
          onDragOver={setDragOverQ}
          onSectionChange={setActiveSection}
        />
      </div>
      {showToast && <SaveToast time={formatTime(lastSaved)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
