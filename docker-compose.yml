services:
  db:
    image: pgvector/pgvector:pg16
    container_name: grc_postgres
    environment:
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: grc_secret
      POSTGRES_DB: grc_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc -d grc_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
